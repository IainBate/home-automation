  daily_input_file_path: ""

# =============================================================================
# DASHBOARD WEB INTERFACE (scripts/dashboard_server.py)
# =============================================================================
# Read-only status dashboard - solar/battery, EV charging, hot water - for
# viewing on your phone over the home network. Never changes battery mode,
# charger mode, or hot water settings; runs as its own independent process
# alongside (not instead of) battery_mode_daemon.py and hotwater_mode_daemon.py.
web_interface:
  enabled: true
  host: "0.0.0.0"                          # Bind all interfaces so phones on the LAN can reach it
                                            # (not internet-facing unless you separately port-forward)
  port: 8000
  debug_mode: false                        # Never enable in production - Flask debug mode allows
                                            # remote code execution via its interactive debugger
  poll_interval_seconds: 120               # How often to refresh cached status from the inverters/
                                            # Ohme/MELCloud in the background (phones just read the
                                            # cache - this doesn't scale with how many phones look).
                                            # Raised from 45s 2026-09-04: this poll drives no
                                            # automation decision (battery/hot-water/Ohme daemons all
                                            # poll hardware on their own independent schedules), so
                                            # slowing it only affects how fresh a rarely-viewed phone
                                            # page is - not worth the SolaX/Airstage/MELCloud call
                                            # volume at 45s. MELCloud's own direct dashboard call is
                                            # now removed entirely (see melcloud_status_cache.py);
                                            # this interval only matters for SolaX/Airstage/service
                                            # health now.

# =============================================================================
# LOGGING CONFIGURATION
# =============================================================================
# Use DEBUG for troubleshooting, WARNING for normal operation
logging:
  console_level: "WARNING"                 # Console log level
  file_level: "DEBUG"                      # File log level

# =============================================================================
# EMAIL (src/utils/emailer.py)
# =============================================================================
# Used by scripts/weekly_health_check.py to send you a summary when it finds
# a significant issue. Sends via the `msmtp` command-line tool rather than
# talking SMTP directly - the Pi already has msmtp configured and working for
# iain.bate@gmail.com (~/.msmtprc, the same setup its existing
# home_backup/backup_PI scripts use), so this reuses that instead of asking
# for a separate credential. No username/password lives here - msmtp owns
# its own credentials. On a machine without msmtp configured (e.g. this dev
# machine), leave enabled: false - sending will just log an error and return
# False rather than crash anything that calls it.
email:
  enabled: true
  to_address: "iain.bate@gmail.com"        # Where weekly health check alerts are sent
  # from_address: "iain.bate@gmail.com"    # Optional - sets the email's From: header
  # msmtp_account: "gmail"                 # Optional - picks a named account from ~/.msmtprc
                                            # instead of its default
  # msmtp_binary: "/usr/bin/msmtp"         # Optional - override if msmtp isn't on PATH
  timeout_seconds: 30

# =============================================================================
# WEEKLY HEALTH CHECK (scripts/weekly_health_check.py)
# =============================================================================
# Scans logs/*.log* (rotated files included) for ERROR/CRITICAL entries in the
# last log_lookback_days, and checks that the listed systemd services are
# active (skipped gracefully if systemctl isn't available, e.g. when run on a
# dev machine rather than the Pi). Only sends an email (via the email: section
# above) when it finds something - a clean week is silent, not a routine
# all-clear message. Intended to run weekly via cron, e.g.:
#   0 8 * * 1 cd /home/pi/home_automation && venv/bin/python3 scripts/weekly_health_check.py
weekly_health_check:
  enabled: true
  log_lookback_days: 7
  systemd_services:
    - "home_automation.service"            # battery_mode_daemon.py
    - "home_automation_hotwater.service"   # hotwater_mode_daemon.py
    - "home_automation_dashboard.service"  # dashboard_server.py
    - "home_automation_ohme.service"       # ohme_status_daemon.py

# =============================================================================
# DAILY DIGEST CHECK (scripts/daily_digest_check.py)
# =============================================================================
# Scans the listed cron-driven pollers' log files (WARNING/ERROR/CRITICAL -
# these scripts now log to their own rotating file instead of stderr when run
# with --quiet, see src/utils/logging_setup.py, so cron's own MAILTO no
# longer mails an email per poll cycle) for the last log_lookback_days.
# A message that occurred fewer than min_occurrences times is dropped
# entirely - a single blip (a rate-limit, one out-of-range sensor reading) is
# assumed transient and not worth reporting; only something that recurred is
# included, most-important level first. Only sends an email (via the email:
# section above) when something recurred - a clean day is silent. This is
# separate from weekly_health_check above, which covers the priority
# battery/hot-water daemons; this one is for lower-priority "web service" API
# pollers only. Intended to run daily via cron, e.g.:
#   0 7 * * * cd /home/pi/home_automation && venv/bin/python3 scripts/daily_digest_check.py --quiet
daily_digest_check:
  enabled: true
  log_lookback_days: 1
  min_occurrences: 2
  log_files:
    - "claude_usage_poller.log"
    - "mg_saic_poller.log"
    - "solar_forecast_predictor.log"
    - "solar_forecast_trainer.log"
    # Every 5 minutes, and the only thing keeping
    # data/solax_historical_data.json growing at all (see
    # src/api_clients/solax_cloud_client.py's module docstring) - so a
    # silent, repeated failure here would starve both the solar forecast
    # trainer and the battery evening predictor of new data.
    - "solax_realtime_logger.log"
    - "ohme_status_daemon.log"
    - "healthchecks_heartbeat.log"

# =============================================================================
# HEALTHCHECKS.IO HEARTBEAT (scripts/healthchecks_heartbeat.py)
# =============================================================================
# A dead-man's-switch, distinct from weekly_health_check/daily_digest_check
# above: those email you FROM the Pi when they find something wrong, which
# means a Pi that's powered off, off the network, or has a dead cron simply
# sends no email at all - indistinguishable from "nothing to report". This
# instead pings an external Healthchecks.io check on a short, fixed cadence;
# Healthchecks.io itself emails you if a ping doesn't arrive on schedule, so
# it catches the whole-Pi-down case the other two can't. Uses the same
# Healthchecks.io account as ~/bin/home_backup on the Pi, but its own
# separate check (a different ping_url) - one dead job shouldn't silence
# alerts for the other.
#
# ping_url is account-specific - real value lives in secrets.yaml (see
# secrets.yaml.example), not here. Create the check at https://healthchecks.io
# (Period: ~15m, Grace time: ~10m, to comfortably survive one missed 10-minute
# cron tick without a false alarm), then run via cron every 10 minutes:
#   */10 * * * * cd /home/pi/home_automation && venv/bin/python3 scripts/healthchecks_heartbeat.py --quiet
healthchecks_io:
  enabled: true
  ping_url: "https://hc-ping.com/your-check-uuid-here"  # Placeholder - real value in secrets.yaml
  timeout_seconds: 10

# =============================================================================
# ENCRYPTED SECRETS BACKUP (scripts/encrypt_secrets.sh / decrypt_secrets.sh)
# =============================================================================
# secrets.yaml is gitignored (real credentials) and normally only lives on
# this machine and the Home Pi4 - secrets.yaml.enc is a passphrase-encrypted
# copy that IS committed to git, so a fresh install can recover it even if
# both machines were lost. passphrase_hash below is a SHA-256 hash (not the
# raw passphrase) - real value lives in secrets.yaml (see
# secrets.yaml.example). Leave unset to be prompted interactively each run;
# set it to let encrypt_secrets.sh run unattended, e.g. daily on the Pi:
#   0 3 * * * cd /home/pi/home_automation && bash scripts/encrypt_secrets.sh --quiet
secrets_backup:
  passphrase_hash: "your-passphrase-sha256-hash"  # Placeholder - real value in secrets.yaml
