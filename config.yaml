# SolaX Modbus and Ohme EV Configuration
# Edit this file with your actual settings before running scripts
#
# IMPORTANT: This package uses Modbus TCP for direct inverter access.
# Cloud API fields (token_id, wifisn) are required by the config schema
# but NOT USED for Modbus operations - leave as placeholders.

# =============================================================================
# SOLAX CONFIGURATION
# =============================================================================
# Direct hardware access to SolaX inverters via Modbus TCP
#
# How to find inverter IP addresses:
#   1. Check your router's DHCP client list
#   2. Look for devices named "Pocket WiFi" or SolaX serial numbers
#   3. Recommended: Set static DHCP reservations to prevent IP changes
solaX_cloud_api:
  # Cloud API settings (NOT USED for Modbus - leave as placeholders)
  base_url: "https://www.solaxcloud.com"
  token_id: "NOT_USED_FOR_MODBUS"
  master_wifisn: "NOT_USED_FOR_MODBUS"
  slave_wifisn: "NOT_USED_FOR_MODBUS"

  # REQUIRED: IP addresses of your SolaX inverters
  master_ip: "192.168.68.105"      # Example: "192.168.1.100"
  slave_ip: "192.168.68.103"        # Example: "192.168.1.101"

  # REQUIRED: Enable Modbus TCP access
  modbus_enabled: true                      # Must be true for this package to work

  # OPTIONAL: Modbus connection parameters (defaults shown)
  modbus_port: 502                         # Standard Modbus TCP port
  modbus_connection_timeout: 10            # Seconds to wait for connection
  modbus_read_timeout: 5                   # Seconds to wait for read response
  master_modbus_address: 1                 # Modbus slave address for master inverter
  slave_modbus_address: 2                  # Modbus slave address for slave inverter
  min_command_interval: 1.0                # Minimum seconds between Modbus commands

# =============================================================================
# BATTERY SYSTEM CONFIGURATION
# =============================================================================
# Physical battery capacity information
battery_system:
  master_capacity_kwh: 11.52               # Usable capacity of master battery (kWh)
  slave_capacity_kwh: 11.52                # Usable capacity of slave battery (kWh)
  absolute_min_soc_percent: 10             # Minimum SoC to maintain for battery health
  standby_power_threshold_w: 20.0          # Power threshold for standby detection

  # Simulation parameters (used for capacity calculations)
  simulation:
    enabled: false                         # Not used in this package
    charge_efficiency_percent: 92
    discharge_efficiency_percent: 92
    max_charge_rate_kw: 12.5
    max_discharge_rate_kw: 12.5
    self_discharge_percent_per_hour: 0.01
    soc_charge_taper_threshold_percent: 90
    soc_charge_taper_rate_percent: 50

# =============================================================================
# OHME EV CHARGER CONFIGURATION
# =============================================================================
# Access to Ohme Home Pro EV charger via Ohme cloud API
#
# How to get credentials:
#   Use your Ohme app login credentials (same as app.ohme.io)
#
# username/password below are placeholders - real values live in secrets.yaml
# (gitignored, merged in at load time - see secrets.yaml.example).
ohme_ev:
  enabled: true                            # Set to false to disable Ohme features
  username: "your-ohme-email@example.com"  # Ohme account email/username - see secrets.yaml
  password: "your-ohme-password"           # Ohme account password - see secrets.yaml
  refresh_interval_minutes: 15             # How often to poll charger data
  connection_timeout: 30                   # Connection timeout in seconds
  retry_attempts: 3                        # Retry attempts for failed API calls
  # How often scripts/ohme_status_daemon.py refreshes the shared status
  # cache that the battery daemon, hot water automation and dashboard all
  # read (see src/api_clients/ohme_status_cache.py). That daemon logs in
  # ONCE at startup and reuses the session, so this cadence costs one API
  # call - not a login - unlike the per-consumer polling it replaced.
  # Readers ignore the cache once it's older than ~150s and fall back to
  # their own direct call, so keep this comfortably under that.
  status_poll_interval_seconds: 30

# =============================================================================
# MELCLOUD HOT WATER TANK CONFIGURATION
# =============================================================================
# Access to a Mitsubishi Ecodan hot water tank via the MELCloud cloud API -
# the same account used by the official MELCloud iPhone app.
#
# email/password below are placeholders - real values live in secrets.yaml
# (gitignored, merged in at load time - see secrets.yaml.example).
melcloud:
  enabled: true                            # Read-only testing (status/--dry-run); does NOT by
                                            # itself let anything force-heat - that's gated
                                            # separately by hotwater_automation.enabled below
  email: "your-melcloud-email@example.com" # MELCloud account email - see secrets.yaml
  password: "your-melcloud-password"       # MELCloud account password - see secrets.yaml
  device_name: ""                          # Optional: name of the tank device to control.
                                            # Leave blank to auto-select if there's only one.

  # Forced hot water mode change verification (src/api_clients/melcloud_client.py
  # set_force_hot_water) - also reused for the unit's separate power on/standby
  # toggle (set_power), which set_force_hot_water calls automatically around a
  # force-heat cycle (on before, off after). The MELCloud app often needs a
  # change requested more than once before the physical unit applies it - these
  # settings control the request -> wait -> check -> retry loop that works
  # around that. Each attempt does one check (not continuous polling), since
  # MELCloud's API documents that device status should not be fetched more than
  # once a minute. There's no urgency for a force-heat/legionella/power change
  # to land quickly, so these favour giving each attempt's cloud round-trip more
  # room over a fast worst case - 4 x 15s is a deliberate, easy-to-reason-about
  # one minute total.
  mode_change_retry:
    max_attempts: 4                        # How many times to (re-)request the change
    check_delay_seconds: 15                # Wait this long after each request before checking
                                            # whether MELCloud reports the new mode/power state

# =============================================================================
# HOT WATER AUTOMATION (scripts/hotwater_mode_daemon.py, hotwater_auto_check.py)
# =============================================================================
# Automatic force-heat decision. Force-heats the tank if it needs it
# (tank_temp_threshold_c) and either:
#   - the Ohme EV charger is confirmed charging (same power-threshold +
#     2-consecutive-cycle confirmation as battery_system's own Ohme charging
#     check - see ohme_charging_threshold_watts below) AND it's still before
#     trigger_hour - Ohme has already chosen an economical time to draw
#     power, so hot water piggybacks on it while still watching for it, or
#   - it's at/after trigger_hour AND the battery has surplus stored solar
#     (battery_soc_min_percent) or the grid is in its off-peak window.
# Car charging is only monitored *before* trigger_hour, not indefinitely: if
# the car hasn't started charging by trigger_hour, the decision switches
# over entirely to the battery/off-peak check - heating immediately from
# stored solar if there's enough of it, or otherwise waiting for the
# off-peak window.
# Tariff: Octopus Intelligent Go, whose whole-home off-peak window is fixed
# (offpeak_start/offpeak_end below) rather than the half-hourly Agile pricing -
# this does NOT use api_settings.octopus_product_code/octopus_tariff_region_code
# (those are Agile-specific and unused here).
# Requires melcloud (above) to be enabled and configured; uses solaX_cloud_api
# for battery SoC and ohme_ev for the charging check.
#
# Because the car-charging condition can occur at any time before
# trigger_hour, run this continuously via hotwater_mode_daemon.py (mirrors
# battery_mode_daemon.py's architecture) rather than a once-daily cron job.
#
# Holiday mode (scripts/holiday_mode.py): "for N days, don't force-heat the
# tank via the ASHP" - overrides every trigger above (car charging, battery
# surplus, off-peak) while active. No config toggle here - it's a runtime
# command that stamps a holiday.until timestamp into
# hotwater_automation_state.json (see get_hotwater_automation_state_path()),
# read fresh on every force-heat check. Solar water heating (if you have a
# separate diverter) is entirely outside this codebase and unaffected.
hotwater_automation:
  enabled: true                            # melcloud configured and tested (enabled 2026-09-02)
  trigger_hour: 21.5                       # Local hour (24h, fractional - 21.5 = 9:30pm) at which
                                            # car-charging monitoring stops and the battery/off-peak
                                            # conditions take over (see above).
  car_charging_trigger_start_hour: 15      # Car charging only counts as a force-heat trigger from
                                            # this hour (3pm) up to trigger_hour - excludes the
                                            # morning/midday specifically, since solar water heating
                                            # is still effective then and an unrelated EV charging
                                            # session shouldn't force-heat the ASHP in that window.
  ohme_charging_threshold_watts: 500       # Same threshold/meaning as battery_mode_daemon_config.json's
                                            # ohme_charging_threshold_watts - kept as a separate value
                                            # here since this lives in config.yaml, not that JSON file.
  tank_temp_threshold_c: 45                # Force-heat only if the tank is below this
  battery_soc_min_percent: 20              # Both batteries (the lower of master/slave, not their
                                            # average - see hotwater_automation_core.py's
                                            # get_battery_soc_percent) must be at/above this. Used by
                                            # both the evening/off-peak live-SoC check below AND the
                                            # battery-prediction path further down.
  offpeak_start: "23:30"                   # Octopus Intelligent Go whole-home off-peak window
  offpeak_end: "05:30"                     # (fixed daily window, crosses midnight). Also the hard
                                            # completion deadline for an overnight force-heat/legionella
                                            # cycle - see _overnight_deadline_passed.
  force_heat_max_duration_hours: 1         # Safety net only - the revert check normally reverts
                                            # as soon as the tank reaches its own target
                                            # temperature; this is a backstop in case MELCloud
                                            # never reports that (e.g. a stuck sensor reading).
                                            # Kept short (1h) - a heating run isn't expected to run
                                            # long; a run that's still going after this is stopped
                                            # and retried at the next due trigger instead.
  battery_prediction_window_start_hour: 15 # 3pm - see the battery-prediction path below
  battery_prediction_deadline_hour: 23.5   # 11:30pm - defaults to offpeak_start above (the moment
                                            # cheap grid import opens anyway). An independent trigger
                                            # path, alongside car charging and the evening/off-peak
                                            # window: if it's currently within
                                            # [battery_prediction_window_start_hour, this), and both
                                            # batteries (min, not average) are predicted to still be
                                            # >= battery_soc_min_percent by this deadline (see
                                            # hotwater_automation_core.py's
                                            # get_battery_prediction_to_deadline), heat now from
                                            # stored solar rather than waiting for trigger_hour.
  poll_interval_seconds: 600               # hotwater_mode_daemon.py: how often to run the
                                            # force-heat check (10 min - frequent enough to catch
                                            # EV charging starting)
  revert_check_interval_seconds: 3600      # hotwater_mode_daemon.py: how often to run the
                                            # revert-if-due check (which also reverts on reaching
                                            # target temperature), and the legionella progress
                                            # check (1 hour)
  daily_check_hour: 18                     # Fixed local hour (24h, fractional - 6pm) at which the
                                            # tank's below-threshold state is snapshotted once a day.
                                            # Every force-heat path EXCEPT car charging (which stays
                                            # on a live reading - see car_charging_trigger_start_hour
                                            # above) is decided from THIS one reading, not whatever
                                            # the tank happens to read whenever the evening/battery/
                                            # off-peak trigger actually fires later that night - so is
                                            # the legionella-due decision below.

  # Legionella high-temperature cycle (DIY - MELCloud has no dedicated trigger for
  # this). Rides on the exact same trigger as a normal force-heat above (car
  # charging, or evening window + battery/off-peak) - there is no separate
  # schedule for *when* it fires. Whether a cycle is due at all uses the same
  # daily_check_hour snapshot as the normal (non-car-charging) heat decision
  # above: if the tank was below tank_temp_threshold_c at that fixed time,
  # and legionella_interval_days have passed since the last completed cycle,
  # the next time the normal trigger fires (whenever that ends up being
  # overnight, per the usual battery/off-peak timing) it raises the tank's
  # target temperature and force-heats to that instead of the normal target,
  # then restores the original target once done. This means a cycle never
  # runs sooner than legionella_interval_days, but can run later if the
  # normal trigger conditions don't occur for a while. A car-charging-
  # triggered heat is never upgraded to legionella, since it's decided from
  # a live reading, not this snapshot. Confirm your hot water outlets have a
  # thermostatic mixing valve (standard on UK systems) before relying on
  # this, since it's a real temperature spike at the tank.
  legionella_interval_days: 90             # Minimum days between cycles (~3 months)
  legionella_target_temp_c: 55             # Target temperature requested from MELCloud for the
                                            # cycle. Kept at the disinfection-sufficient temperature
                                            # below (not higher, e.g. 60) since some ASHPs can't
                                            # reliably reach the top of their nominal range,
                                            # especially in cold weather - asking for more than the
                                            # tank needs just means the cycle runs the full
                                            # legionella_max_cycle_duration_hours every time chasing
                                            # a target it may never reach.
  legionella_max_cycle_duration_hours: 1   # Safety timeout: revert even if not disinfected yet
                                            # (kept in step with force_heat_max_duration_hours above -
                                            # see its comment)
  legionella_due_warning_days: 7           # Send a warning email (email: section below) this many
                                            # days before a legionella cycle becomes due, so there's
                                            # notice before the tank starts running hotter than usual -
                                            # see check_legionella_due_warning
  legionella_natural_completion_temp_c: 55 # A tank reading at/above this, at ANY time and
                                            # regardless of what heated it (this cycle, or e.g. an
                                            # off-grid solar diverter this project can't otherwise
                                            # see), counts as satisfying the current interval -
                                            # resets legionella_interval_days from that moment.

  max_prediction_age_hours: 3              # How old battery_evening_prediction.json (below) may
                                            # be before the force-heat check ignores it and falls
                                            # back to a live SoC reading instead

# =============================================================================
# BATTERY EVENING SOC PREDICTION (scripts/battery_evening_predictor.py)
# =============================================================================
# Predicts battery SoC a few hours after hotwater_automation.trigger_hour, so the
# force-heat decision knows whether stored solar will still be there by the time a
# multi-hour heating run finishes, rather than trusting a single live reading at
# trigger_hour to still hold true hours later.
#
# Not a trained ML model - a simple "analog day" statistic: how SoC has historically
# moved between two times of day in the same calendar month, read from
# data/solax_historical_data.json (collected by scripts/solax_cloud_data_logger.py).
# Entirely decoupled from battery_mode_daemon.py: only reads that historical log and
# a live SoC value, never touches the battery daemon's own process or state.
#
# When solar_forecast (below) is enabled and has produced a forecast, this
# additionally corrects the historical average using today's actual forecast
# generation for the trigger-to-horizon window (a small linear fit, not a
# separate model of its own - see
# src/core_logic/battery_evening_prediction_logic.py's
# fit_generation_drift_correction) - nudging the prediction toward what
# today's specific weather implies rather than only ever looking backward at
# a typical day for the month. Falls back to the plain historical average
# whenever solar_forecast is disabled/unavailable or there isn't enough
# paired historical PV data to fit it - this correction is optional, on top
# of a method that already works without it.
#
# Run once daily via cron shortly before trigger_hour, e.g.:
#   55 20 * * * cd /path/to/repo && python3 scripts/battery_evening_predictor.py --quiet
battery_evening_prediction:
  enabled: true
  trigger_hour: 21.5                       # Defaults to hotwater_automation.trigger_hour if unset
  horizon_hours: 3                         # Defaults to hotwater_automation.force_heat_max_duration_hours
                                            # if unset - how far ahead of trigger_hour to predict
  min_sample_days: 5                       # Minimum matching historical days (same calendar month)
                                            # required to produce a prediction; below this, the
                                            # predictor writes "unavailable" and callers fall back
                                            # to a live SoC reading

# =============================================================================
# SOLAR GENERATION FORECAST (scripts/solar_forecast_trainer.py,
# scripts/solar_forecast_predictor.py)
# =============================================================================
# Predicts today's and tomorrow's solar generation from a random forest model
# trained on this system's own historical PV output (data/solax_historical_data.json)
# joined with historical weather (Open-Meteo, free, no API key) for your exact
# location - deliberately NOT Solcast's generic forecast, which doesn't account
# for this roof's specific shading/orientation quirks. Display-only: nothing
# reads this to make automation decisions (unlike battery_evening_prediction
# above, which hotwater_automation does use).
#
# Setup:
#   1. Set location.latitude/longitude above to your home's real coordinates.
#   2. Run once to train:      python3 scripts/solar_forecast_trainer.py
#   3. Run periodically (e.g. hourly via cron) to refresh the forecast:
#        0 * * * * cd /path/to/repo && python3 scripts/solar_forecast_predictor.py --quiet
#   4. Re-run step 2 periodically (e.g. weekly) as more historical data accumulates.
solar_forecast:
  enabled: true                            # Model trained on data through 2026-07-09 - re-run
                                            # scripts/solar_forecast_trainer.py periodically (e.g.
                                            # weekly) as more historical data accumulates

# =============================================================================
# FUJITSU AIRSTAGE DUCTLESS HEAT PUMPS (src/api_clients/airstage_client.py)
# =============================================================================
# Read-only zone status (mode, current/target temperature) via local network
# control - no Fujitsu cloud account needed, unlike ohme_ev/melcloud above.
# Uses the unofficial `pyairstage` library talking directly to each unit over
# your home network. One dashboard card per zone listed below.
#
# How to find each zone's ip_address/device_id:
#   1. Find the unit's MAC address (router's DHCP client list, or the
#      "AP-WH3X-XXXXXXXXXXXX" WiFi network it broadcasts during setup - the
#      last 12 characters after "AP-WH3X-" are the same as the MAC).
#   2. ip_address: that device's IP (same DHCP client list; a static
#      reservation is recommended, as with the SolaX inverters above).
#   3. device_id: the MAC address with the ':'/'-' separators removed
#      (e.g. "AA:BB:CC:11:22:33" -> "AABBCC112233").
airstage:
  enabled: true                            # Both zones' ip_address/device_id are set
  timeout_seconds: 10
  zones:
    - name: "Landing"
      ip_address: "192.168.68.106"
      device_id: "CC4740B21091"            # From MAC CC-47-40-B2-10-91
    - name: "Playroom"
      ip_address: "192.168.68.107"
      device_id: "106838C4462B"            # From MAC 10-68-38-C4-46-2B

# =============================================================================
# RESIDEO THERMOSTAT (src/api_clients/resideo_client.py)
# =============================================================================
# Read-only thermostat status (T6R and other Evohome-family devices) via
# evohome-async, an unofficial but actively-maintained client for the same
# TCC v2 backend ("tccna.resideo.com") the Resideo/Honeywell Home app itself
# uses - authenticates with your normal app username/password, no developer
# portal registration needed (Resideo's official OAuth2 API - developer.
# honeywellhome.com - proved impractical to get approved for; see git
# history for that earlier approach). Trade-off: unofficial/reverse-engineered,
# so it could break on a backend change with no notice, same risk category
# as this project's Ohme client.
resideo:
  # Disabled: this account's T6R thermostat is a Resideo "Lyric" device, on a
  # different backend than evohome-async targets (confirmed 2026-09-02 - the
  # account's real credentials correctly fail on the legacy TCC portal
  # evohome-async uses). Re-enable only after switching to the official Lyric
  # developer OAuth2 API (api.honeywellhome.com) - see resideo_client.py.
  enabled: false
  username: "your-resideo-email@example.com"  # Placeholder - real value in secrets.yaml
  password: "your-resideo-password"            # Placeholder - real value in secrets.yaml

# =============================================================================
# CLAUDE CODE USAGE (src/api_clients/claude_usage_client.py)
# =============================================================================
# Shows your Claude Code subscription's 5-hour session and weekly usage
# percentages on the dashboard - the same numbers the "Claude Usage" macOS
# menu bar app and Claude Code itself show, via the same OAuth login token
# (NOT an Anthropic API key - that measures a different, pay-per-token product).
#
# No manual token copying needed: scripts/claude_usage_poller.py reads
# whichever machine it runs on's own Claude Code login directly (macOS
# Keychain, or ~/.claude/.credentials.json on Linux) every time it polls -
# see claude_usage_client.py's module docstring. This means `claude` needs
# to be logged in and used at least occasionally on THAT machine (the one
# running the cron job below) to stay fresh - typically the Pi itself, once
# you've run `claude` there once to log in.
#
# access_token below is only a manual fallback for a machine that never runs
# `claude` itself - see scripts/claude_usage_token_extract.py to populate it.
#
# IMPORTANT: the usage endpoint's rate limit is shared with your real Claude
# Code sessions - this is polled independently and slowly
# (scripts/claude_usage_poller.py via cron, NOT the dashboard's fast poll
# loop) specifically to avoid competing with your actual usage. A prior
# incident (documented in claude_usage_client.py) saw 45 minutes of
# sustained failures for every client on the account from polling too fast -
# do not go faster than the 10-minute cron cadence below.
#
# Setup: set enabled: true below, then add a cron entry on the machine that
# runs `claude` (the Pi, typically):
#   */10 * * * * cd /path/to/repo && python3 scripts/claude_usage_poller.py --quiet
claude_usage:
  enabled: true
  access_token: "your-claude-code-access-token"  # Optional manual fallback - see comments above

# =============================================================================
# MG SAIC EV (src/api_clients/saic_client.py)
# =============================================================================
# Shows the car's battery % and range on the dashboard, via the MG iSmart
# cloud API (saic-ismart-client-ng package - NOT the saic-python-client-ng-master/
# directory this project's docs mention, which doesn't actually exist here).
#
# IMPORTANT trade-offs (see saic_client.py's module docstring):
#   - This logs into the SAME MG account already used by household phones,
#     by your own choice - MG's backend can only have so many concurrent
#     sessions, so this *could* occasionally log a phone out (it
#     self-recovers). If that becomes a nuisance, switch to a second,
#     dedicated MG account here instead (no code change needed) - MG
#     supports registering one vehicle to multiple accounts.
#   - Deliberately polled infrequently (hourly, via cron - see
#     scripts/mg_saic_poller.py - NOT the dashboard's fast poll loop) to
#     minimize that risk. The underlying library also can't reuse a login
#     session across runs, so every poll does a fresh login regardless.
#
# Setup: put username/password in secrets.yaml (see secrets.yaml.example),
# set enabled: true, and add a cron entry:
#   0 * * * * cd /path/to/repo && python3 scripts/mg_saic_poller.py --quiet
mg_saic:
  enabled: true
  username: "iain.bate@gmail.com"
  password: "your-mg-ismart-password"            # Placeholder - real value in secrets.yaml
  username_is_email: true
  region: "eu"                                   # "eu", "au", or "tr" - UK accounts use "eu"
  vin: ""                                        # Optional - leave blank to auto-select the
                                                  # account's current vehicle (fine for one car)

